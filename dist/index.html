<!doctype html>
<html lang="es" data-storage="server">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Conversa de Lukmi SRL: tus canales, automatizaciones y actividad de Instagram y Facebook en un solo lugar."
    />
    <title>Conversa · Tus publicaciones</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="campaigns.css" />
    <link rel="stylesheet" href="session.css" />
    <link rel="stylesheet" href="live-panel.css" />
    <link rel="stylesheet" href="workspace.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#dashboard"
        ><svg class="brand-image" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <path
            d="M33 19a14 14 0 0 1-14 14H8l-4 4V19a15 15 0 1 1 29 0Z"
            stroke="currentColor"
            stroke-width="2.5"
          />
          <circle cx="12" cy="19" r="1.6" fill="currentColor" />
          <circle cx="20" cy="19" r="1.6" fill="currentColor" />
          <circle cx="28" cy="19" r="1.6" fill="currentColor" /></svg
        >conversa<span class="brand-dot">.</span></a
      >
      <div class="live-account-context">
        <span>C</span>
        <div><strong>Mi negocio</strong><small id="live-owner">Mi cuenta de Conversa</small></div>
      </div>
      <label class="workspace-label" for="workspace">ESPACIO DE TRABAJO</label>
      <div class="workspace-wrap">
        <span class="workspace-logo">I</span
        ><select id="workspace">
          <option value="inmobiliaria">Inmobiliaria · Demo</option>
          <option value="casa">Casa Andina</option>
        </select>
      </div>
      <div class="nav-label">TU ESPACIO DE TRABAJO</div>
      <nav aria-label="Principal">
        <button data-page="dashboard"><span data-icon="layers"></span>Publicaciones</button>
        <button data-page="activity"><span data-icon="message"></span>Conversaciones</button>
        <button data-page="automations"><span data-icon="spark"></span>Automatizaciones</button>
        <button data-page="connections"><span data-icon="link"></span>Canales</button>
        <button data-page="customers" hidden><span data-icon="message"></span>Clientes</button>
      </nav>
      <details class="demo-nav">
        <summary>Explorar demo · datos de ejemplo</summary>
        <nav aria-label="Simulador">
          <button data-page="inbox">
            <span data-icon="inbox"></span>Bandeja de ejemplo<span class="nav-count" id="nav-count"
              >3</span
            >
          </button>
          <button data-page="campaigns"><span data-icon="spark"></span>Campañas de ejemplo</button>
          <button data-page="leads"><span data-icon="message"></span>Prospectos de ejemplo</button>
          <button data-page="channels"><span data-icon="link"></span>Canales de ejemplo</button>
          <button data-page="plans"><span data-icon="layers"></span>Planes de ejemplo</button>
        </nav>
      </details>
      <div class="sidebar-bottom">
        <div class="live-sidebar-note">
          <strong><span class="green-dot"></span>Tu negocio, conectado.</strong>
          <p>Revisa tus cuentas y continúa las conversaciones que lo necesitan.</p>
          <button data-page="connections">Ver mis canales <span data-icon="arrow"></span></button>
        </div>
        <button class="profile" id="profile">
          <span class="avatar owner">L</span
          ><span
            ><strong data-profile-name>Mi negocio</strong><small>Mi cuenta de Conversa</small></span
          ><span>⌄</span>
        </button>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div>
          <span class="breadcrumb">Espacio de trabajo</span><span class="slash">/</span
          ><span id="breadcrumb-page">Bandeja</span>
        </div>
        <div class="topbar-right">
          <span class="demo-tag">ACTIVIDAD REAL</span
          ><button class="icon-button" id="help" aria-label="Ayuda de Conversa">
            <span data-icon="help"></span></button
          ><span class="avatar small owner">L</span>
        </div>
      </header>
      <main id="main"></main>
      <footer class="workspace-footer">
        <span class="powered-by">powered by <strong>ChatGo</strong></span>
        <span
          ><a href="/privacidad/">Privacidad</a> · <a href="/terminos/">Condiciones</a> ·
          <a href="/eliminar-datos/">Eliminar datos</a></span
        >
      </footer>
    </div>
    <dialog id="dialog">
      <form id="dialog-form">
        <div class="dialog-head">
          <h2 id="dialog-title"></h2>
          <button type="button" class="icon-button" id="close-dialog" aria-label="Cerrar">✕</button>
        </div>
        <div id="dialog-body"></div>
        <div id="dialog-actions"></div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.mjs"></script>
  </body>
</html>
