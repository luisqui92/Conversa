name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: docker build -f backend/Dockerfile -t conversa-check .
      - run: bash -n ops/backup-offsite.sh ops/check-restore.sh
      - run: node --test ops/restore-script-checks.mjs ops/deploy-stdin-checks.mjs
