name: conversa-demo

services:
  api:
    image: conversa-demo-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      APP_ORIGIN: https://cc.chatgo.ia.bo
      DATABASE_PATH: /data/conversa.sqlite
      MASTER_KEY_PATH: /run/conversa-keys/master.key
      CHANNEL_ACCOUNTS: "1"
    volumes:
      - conversa_data:/data
      - conversa_keys:/run/conversa-keys:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  init:
    image: conversa-demo-api
    profiles: [maintenance]
    user: root
    command: [node, backend/initialize.mjs]
    environment:
      DATABASE_PATH: /data/conversa.sqlite
      MASTER_KEY_PATH: /run/conversa-keys/master.key
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-1797199674816532}
    volumes:
      - conversa_data:/data
      - conversa_keys:/run/conversa-keys
    network_mode: none
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/srv:ro
      - ./Caddyfile.vm:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  conversa_data:
  conversa_keys:
